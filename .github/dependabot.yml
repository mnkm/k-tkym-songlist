# ワークフローで使うアクションの定期更新。
# npm のライブラリは定期更新の対象にしない（脆弱性の修正 PR は、この設定と別に随時作られる）。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    # 更新は 1 本の PR にまとめる
    groups:
      actions:
        patterns:
          - "*"
